<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lawbot - 거래내역서 분석 V3.0 (AI Powered)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (Excel Export) -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <!-- PDF.js for parsing PDF files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-gray-200 flex flex-col justify-between hidden md:flex">
            <div>
                <div class="flex items-center px-6 py-5 border-b border-gray-100">
                    <div class="flex items-center space-x-2">
                        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">L</div>
                        <span class="text-xl font-bold tracking-tight text-blue-900">Lawbot</span>
                    </div>
                </div>

                <nav class="px-4 py-4 space-y-1 text-sm">
                    <a href="#" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 font-medium">
                        <i class="fa-solid fa-bullhorn w-5 text-gray-400"></i>
                        <span>공지사항</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-blue-50 text-blue-600 font-semibold">
                        <i class="fa-solid fa-file-lines w-5 text-blue-500"></i>
                        <span>거래내역서 분석</span>
                    </a>
                    <a href="#" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-50 font-medium">
                        <i class="fa-solid fa-clock-rotate-left w-5 text-gray-400"></i>
                        <span>분석 기록</span>
                    </a>
                </nav>
            </div>

            <!-- API Key Setting in Footer -->
            <div class="p-4 border-t border-gray-100 bg-gray-50 space-y-2">
                <label class="block text-xs font-bold text-gray-600">Gemini API Key 설정</label>
                <input type="password" id="apiKeyInput" placeholder="AI 분석용 API 키 입력" class="w-full text-xs border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-blue-500">
                <div class="flex items-center justify-between pt-1">
                    <span class="text-xs text-gray-500">김은진님</span>
                    <button onclick="saveApiKey()" class="text-xs bg-blue-600 text-white px-2.5 py-1 rounded hover:bg-blue-700">저장</button>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-screen overflow-y-auto">
            
            <header class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center sticky top-0 z-10">
                <div class="flex items-center space-x-4">
                    <h1 class="text-xl font-bold text-gray-900">거래내역서 분석</h1>
                    <span class="bg-amber-100 text-amber-700 text-xs font-bold px-2.5 py-0.5 rounded-full">v3.0 AI Edition</span>
                </div>
            </header>

            <div class="p-8 max-w-7xl mx-auto w-full space-y-6">
                
                <!-- Notice -->
                <div class="bg-blue-50 border border-blue-100 rounded-xl p-3 text-xs text-blue-800 flex items-center space-x-2">
                    <i class="fa-solid fa-circle-info text-blue-500"></i>
                    <span>PDF나 이미지를 업로드하고 아래 분석 버튼을 누르면 AI가 거래내역을 표로 파싱하여 엑셀로 다운로드해 줍니다.</span>
                </div>

                <!-- Upload Boxes Grid -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- 은행 거래내역서 -->
                    <div onclick="document.getElementById('fileInput').click()" class="border-2 border-dashed border-gray-300 hover:border-blue-500 rounded-2xl p-6 text-center bg-white transition flex flex-col items-center justify-center cursor-pointer group">
                        <p class="text-sm font-semibold text-gray-700 mb-4">거래내역서 업로드</p>
                        <div class="w-12 h-12 rounded-full bg-gray-100 group-hover:bg-blue-50 flex items-center justify-center text-gray-400 group-hover:text-blue-500 mb-3 transition">
                            <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
                        </div>
                        <p id="fileNameDisplay" class="text-xs font-bold text-gray-800">클릭하여 파일 선택 (PDF/이미지)</p>
                        <input type="file" id="fileInput" class="hidden" accept=".pdf,image/*" onchange="handleFileSelect(event)">
                    </div>
                </div>

                <!-- Client Name & Base Amount -->
                <div class="bg-white border border-gray-200 rounded-2xl p-6 space-y-4">
                    <label class="block text-sm font-bold text-gray-900">의뢰인 이름 <span class="text-red-500">*</span></label>
                    <input type="text" id="clientName" placeholder="본인 계좌 간 송금 매칭에 필수 (예: 김은진)" value="김은진" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- Action Button -->
                <div class="flex justify-end">
                    <button onclick="processAndAnalyze()" id="analyzeBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-xl text-sm transition flex items-center space-x-2 shadow-lg">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <span>AI 거래내역 분석 및 엑셀 다운로드</span>
                    </button>
                </div>

                <!-- Loading / Status Box -->
                <div id="statusBox" class="hidden bg-white border border-gray-200 rounded-2xl p-6 text-center space-y-3">
                    <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full"></div>
                    <p id="statusText" class="text-sm font-semibold text-gray-700">AI가 문서를 분석하고 있습니다...</p>
                </div>

            </div>
        </main>
    </div>

    <!-- JavaScript for Processing and Gemini API Integration -->
    <script>
        let uploadedFileText = "";
        let uploadedFile = null;

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value;
            if(key) {
                localStorage.setItem('gemini_api_key', key);
                alert('API 키가 저장되었습니다!');
            }
        }

        async function handleFileSelect(event) {
            uploadedFile = event.target.files[0];
            if (!uploadedFile) return;
            
            document.getElementById('fileNameDisplay').innerText = uploadedFile.name;
            
            if (uploadedFile.type === 'application/pdf') {
                const reader = new FileReader();
                reader.onload = async function() {
                    const typedarray = new Uint8Array(this.result);
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    let fullText = "";
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join(' ');
                        fullText += `--- Page ${i} ---\n` + pageText + "\n";
                    }
                    uploadedFileText = fullText;
                    alert('PDF 텍스트 추출 완료!');
                };
                reader.readAsArrayBuffer(uploadedFile);
            } else {
                // Image handling simulation or base64
                uploadedFileText = "[이미지 파일 업로드됨]";
            }
        }

        async function processAndAnalyze() {
            const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value;
            if (!apiKey) {
                alert('좌측 하단에 Gemini API 키를 먼저 입력하고 저장해주세요.');
                return;
            }
            if (!uploadedFile) {
                alert('분석할 거래내역서 파일(PDF 또는 이미지)을 업로드해주세요.');
                return;
            }

            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            statusBox.classList.remove('hidden');

            try {
                statusText.innerText = "Gemini AI가 거래내역을 구조화하는 중입니다...";

                // Gemini API Call (Gemini 2.5/1.5 Flash)
                const prompt = `다음은 은행/카드 거래내역서 내용입니다. 이 내용을 분석하여 날짜, 적요, 출금액, 입금액, 잔액, 상대방 정보를 포함한 표(JSON 배열 형태)로 추출해주세요.
                의뢰인 이름은 "${document.getElementById('clientName').value}"입니다.
                결과는 반드시 유효한 JSON 형식으로만 응답해주세요. 예시: [{"date": "2026-01-01", "desc": "급여", "withdrawal": 0, "deposit": 3000000, "balance": 5000000, "counterpart": "회사"}]
                
                텍스트 내용:
                ${uploadedFileText}`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                const rawResponse = data.candidates[0].content.parts[0].text;
                
                // Extract JSON from markdown
                const jsonMatch = rawResponse.match(/```json([\s\S]*?)```/) || rawResponse.match(/\[([\s\S]*?)\]/);
                let jsonString = jsonMatch ? (jsonMatch[1] || jsonMatch[0]) : rawResponse;
                
                const parsedData = JSON.parse(jsonString);

                statusText.innerText = "엑셀 파일 생성 중...";

                // Export to Excel using SheetJS
                const worksheet = XLSX.utils.json_to_sheet(parsedData);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "거래내역분석");
                XLSX.writeFile(workbook, "Lawbot_거래내역분석결과.xlsx");

                statusText.innerText = "분석 완료 및 엑셀 다운로드 성공!";
            } catch (error) {
                console.error(error);
                statusText.innerText = "분석 중 오류가 발생했습니다. API 키나 파일을 확인해주세요.";
            }
        }
    </script>
</body>
</html>
